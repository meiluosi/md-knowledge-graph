name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: 四种输出格式都能跑通
        run: |
          node src/cli.js --posts examples --out /tmp/graph.json --format json
          node src/cli.js --posts examples --out /tmp/graph.mmd  --format mermaid
          node src/cli.js --posts examples --out /tmp/graph.html --format html
          node src/cli.js --posts examples --out /tmp/related.json --format related
          test -s /tmp/graph.json
          test -s /tmp/graph.mmd
          test -s /tmp/graph.html
          test -s /tmp/related.json

      - name: 输出必须是合法 JSON 且无重复节点 id
        run: |
          node -e '
            const g = require("/tmp/graph.json");
            const ids = g.nodes.map((n) => n.id);
            const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
            if (dup.length) { console.error("节点 id 重复:", dup); process.exit(1); }
            const known = new Set(ids);
            const dangling = g.edges.filter((e) => !known.has(e.source) || !known.has(e.target));
            if (dangling.length) { console.error("悬空边:", dangling); process.exit(1); }
            const bad = g.edges.filter((e) => !["tag", "category", "link"].includes(e.type));
            if (bad.length) { console.error("未知边类型:", bad); process.exit(1); }
            console.log(`✓ ${ids.length} 个节点 / ${g.edges.length} 条边 / ${g.meta.linkEdges} 条引用边`);
          '

      - name: 干净语料必须通过检查（退出码 0）
        run: |
          mkdir -p /tmp/clean
          printf -- '---\ntitle: A\ntags: [x, y]\ncategory: C\n---\n见 [B](./b.md)\n' > /tmp/clean/a.md
          printf -- '---\ntitle: B\ntags: [x, y]\ncategory: C\n---\n见 [A](./a.md)\n' > /tmp/clean/b.md
          node src/cli.js --posts /tmp/clean --check
          echo "✓ 干净语料退出码 0"

      - name: 示例语料含故意缺陷，--check 必须失败（验证检查器真的在工作）
        run: |
          if node src/cli.js --posts examples --check; then
            echo "✗ 检查器没有发现示例语料里故意植入的断链"
            exit 1
          fi
          echo "✓ 检查器按预期报了错"

      - name: 锚点校验：有效锚点不报、失效锚点必报、代码块假锚点不报
        run: |
          mkdir -p /tmp/anchors
          cat > /tmp/anchors/a.md <<'EOF'
          ---
          title: A
          tags: [x, y]
          category: C
          ---
          ## First Section

          [有效](./b.md#second-section)
          [**失效](./b.md#renamed-section)
          [本文有效](#first-section)

          ```
          [假锚点](#fake)
          ```
          EOF
          cat > /tmp/anchors/b.md <<'EOF'
          ---
          title: B
          tags: [x, y]
          category: C
          ---
          ## Second Section

          回到 [A](./a.md)
          EOF

          if node src/cli.js --posts /tmp/anchors --check; then
            echo "✗ 失效锚点没有被报出来"; exit 1
          fi
          node src/cli.js --posts /tmp/anchors --check 2>/dev/null > /tmp/anchor-report.txt || true
          grep -q "renamed-section" /tmp/anchor-report.txt || { echo "✗ 未点名 renamed-section"; exit 1; }
          if grep -q "second-section\|first-section\|fake" /tmp/anchor-report.txt; then
            echo "✗ 出现了误报（有效锚点或代码块假锚点被报）"; cat /tmp/anchor-report.txt; exit 1
          fi
          echo "✓ 锚点校验：命中 1 个真失效，0 个误报，--no-anchor-check 之外的行为都正确"

      - name: --no-anchor-check 能关闭锚点校验
        run: |
          node src/cli.js --posts /tmp/anchors --check --no-anchor-check > /tmp/noanchor.txt 2>&1 && \
            echo "✓ 关闭后退出 0" || { echo "✗ --no-anchor-check 未生效"; cat /tmp/noanchor.txt; exit 1; }
          if grep -q "失效锚点" /tmp/noanchor.txt; then
            echo "✗ 关闭后仍报了失效锚点"; exit 1
          fi

      - name: 基线机制：全已知 → 退出 0
        run: |
          rm -rf /tmp/blcorpus && cp -r examples /tmp/blcorpus
          node src/cli.js --posts /tmp/blcorpus --update-baseline /tmp/bl.json
          test -s /tmp/bl.json
          node src/cli.js --posts /tmp/blcorpus --check --baseline /tmp/bl.json
          echo "✓ 全部问题已记录时退出 0"

      - name: 基线机制：新增问题 → 退出 1，且只报新增
        run: |
          cat > /tmp/blcorpus/brand-new.md <<'EOF'
          ---
          title: 新文章
          tags: [推理, 量化]
          category: 推理
          ---
          见 [不存在的文件](./nope.md)
          EOF
          if node src/cli.js --posts /tmp/blcorpus --check --baseline /tmp/bl.json > /tmp/newreport.txt 2>&1; then
            echo "✗ 新增问题没有让检查失败"; exit 1
          fi
          grep -q "nope.md" /tmp/newreport.txt || { echo "✗ 未报出新增问题"; exit 1; }
          if grep -q "deleted-draft" /tmp/newreport.txt; then
            echo "✗ 旧的已知问题被当成新增报了出来"; cat /tmp/newreport.txt; exit 1
          fi
          echo "✓ 只报了新增的那一条"

      - name: 基线 key 稳定（插入无关文章不使基线失效）
        run: |
          cp /tmp/blcorpus/brand-new.md /tmp/brand-new.md.bak
          rm /tmp/blcorpus/brand-new.md
          printf -- '---\ntitle: 无关文章\ntags: [推理, 量化]\ncategory: 推理\n---\n正文\n' > /tmp/blcorpus/unrelated.md
          node src/cli.js --posts /tmp/blcorpus --check --baseline /tmp/bl.json > /tmp/stable.txt 2>&1 \
            && echo "✓ 插入无关文章后基线仍然有效" \
            || { echo "✗ 指纹不稳定：无关新增让基线失效了"; cat /tmp/stable.txt; exit 1; }

      - name: 结构化 JSON 报告契约
        run: |
          node src/cli.js --posts examples --check --format json > /tmp/check.json 2>/dev/null || true
          node -e '
            const r = require("/tmp/check.json");
            if (r.schemaVersion !== 1) { console.error("缺 schemaVersion"); process.exit(1); }
            if (typeof r.summary.errors !== "number") { console.error("缺 summary"); process.exit(1); }
            if (!Array.isArray(r.groups)) { console.error("缺 groups"); process.exit(1); }
            for (const g of r.groups) {
              if (!g.code || !g.severity || !Array.isArray(g.items)) { console.error("组结构不全:", g.code); process.exit(1); }
              for (const it of g.items) {
                if (!it.key || !it.message) { console.error("条目缺 key/message:", it); process.exit(1); }
              }
            }
            const anchor = r.groups.find((g) => g.code === "broken-anchor");
            if (!anchor || typeof anchor.items[0].sameFile !== "boolean") {
              console.error("broken-anchor 缺结构化字段"); process.exit(1);
            }
            console.log(`✓ JSON 报告：${r.groups.length} 组 / 错误 ${r.summary.errors} / 警告 ${r.summary.warnings}`);
          '

      - name: 参数互斥与时序错误都要报错
        run: |
          node src/cli.js --posts examples --baseline /tmp/x.json 2>/dev/null && { echo "✗ --baseline 单独使用未报错"; exit 1; }
          node src/cli.js --posts examples --check --baseline /tmp/x.json --update-baseline /tmp/y.json 2>/dev/null && { echo "✗ 互斥参数未报错"; exit 1; }
          node src/cli.js --posts examples --check --format mermaid 2>/dev/null && { echo "✗ 检查模式接受了出图 format"; exit 1; }
          echo "✓ 参数校验符合预期"

      - name: 自定义 URL 模板与 --no-link-edges 可用
        run: |
          node src/cli.js --posts examples --no-link-edges --format json --out /tmp/nolink.json
          node -e '
            const g = require("/tmp/nolink.json");
            const links = g.edges.filter((e) => e.type === "link");
            if (links.length) { console.error("--no-link-edges 未生效"); process.exit(1); }
            console.log("✓ --no-link-edges 生效");
          '
          node src/cli.js --posts examples \
            --post-url "/posts/{id}/" --tag-url "/tags/{slug}/" \
            --category-url "/categories/{slug}/" --format json --out /tmp/urls.json
          node -e '
            const g = require("/tmp/urls.json");
            const post = g.nodes.find((n) => n.type === "post");
            if (!post.url || !post.url.startsWith("/posts/")) {
              console.error("URL 模板未套用:", post); process.exit(1);
            }
            console.log("✓ URL 模板生效:", post.url);
          '
