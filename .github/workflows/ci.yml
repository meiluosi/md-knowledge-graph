name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: 四种输出格式都能跑通
        run: |
          node src/cli.js --posts examples --out /tmp/graph.json --format json
          node src/cli.js --posts examples --out /tmp/graph.mmd  --format mermaid
          node src/cli.js --posts examples --out /tmp/graph.html --format html
          node src/cli.js --posts examples --out /tmp/related.json --format related
          test -s /tmp/graph.json
          test -s /tmp/graph.mmd
          test -s /tmp/graph.html
          test -s /tmp/related.json

      - name: 输出必须是合法 JSON 且无重复节点 id
        run: |
          node -e '
            const g = require("/tmp/graph.json");
            const ids = g.nodes.map((n) => n.id);
            const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
            if (dup.length) { console.error("节点 id 重复:", dup); process.exit(1); }
            const known = new Set(ids);
            const dangling = g.edges.filter((e) => !known.has(e.source) || !known.has(e.target));
            if (dangling.length) { console.error("悬空边:", dangling); process.exit(1); }
            const bad = g.edges.filter((e) => !["tag", "category", "link"].includes(e.type));
            if (bad.length) { console.error("未知边类型:", bad); process.exit(1); }
            console.log(`✓ ${ids.length} 个节点 / ${g.edges.length} 条边 / ${g.meta.linkEdges} 条引用边`);
          '

      - name: 干净语料必须通过检查（退出码 0）
        run: |
          mkdir -p /tmp/clean
          printf -- '---\ntitle: A\ntags: [x, y]\ncategory: C\n---\n见 [B](./b.md)\n' > /tmp/clean/a.md
          printf -- '---\ntitle: B\ntags: [x, y]\ncategory: C\n---\n见 [A](./a.md)\n' > /tmp/clean/b.md
          node src/cli.js --posts /tmp/clean --check
          echo "✓ 干净语料退出码 0"

      - name: 示例语料含故意缺陷，--check 必须失败（验证检查器真的在工作）
        run: |
          if node src/cli.js --posts examples --check; then
            echo "✗ 检查器没有发现示例语料里故意植入的断链"
            exit 1
          fi
          echo "✓ 检查器按预期报了错"

      - name: 自定义 URL 模板与 --no-link-edges 可用
        run: |
          node src/cli.js --posts examples --no-link-edges --format json --out /tmp/nolink.json
          node -e '
            const g = require("/tmp/nolink.json");
            const links = g.edges.filter((e) => e.type === "link");
            if (links.length) { console.error("--no-link-edges 未生效"); process.exit(1); }
            console.log("✓ --no-link-edges 生效");
          '
          node src/cli.js --posts examples \
            --post-url "/posts/{id}/" --tag-url "/tags/{slug}/" \
            --category-url "/categories/{slug}/" --format json --out /tmp/urls.json
          node -e '
            const g = require("/tmp/urls.json");
            const post = g.nodes.find((n) => n.type === "post");
            if (!post.url || !post.url.startsWith("/posts/")) {
              console.error("URL 模板未套用:", post); process.exit(1);
            }
            console.log("✓ URL 模板生效:", post.url);
          '
